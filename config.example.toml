# Copy to config.toml (the installer does this for you).
# Leave a value empty to use sample data for that widget.

[sheet]
id = ""                      # the long code in the sheet's URL: docs.google.com/spreadsheets/d/<THIS PART>/edit
tab = "Inventory"         # tab name; empty = first tab
key_file = "robot-key.json"  # the robot account's key file, placed in this folder

[calendar]
ical_url = ""                # Google Calendar > Settings > "Secret address in iCal format"
refresh_seconds = 120        # how often to check for new events

[weather]
lat = 53.5232                # UAlberta, Edmonton
lon = -113.5263

[display]
linktree = "https://linktr.ee/compeclub"
